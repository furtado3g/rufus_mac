[package]
name = "image2usb-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "image2usb graphical interface"

[[bin]]
name = "image2usb-gui"
path = "src/main.rs"

[features]
windows-media = ["image2usb-extract/windows-media"]

[dependencies]
image2usb-core.workspace = true
image2usb-platform.workspace = true
image2usb-iso.workspace = true
image2usb-extract.workspace = true
eframe.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, features = ["glow"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints.rust]
unsafe_code = "forbid"
