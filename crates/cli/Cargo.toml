[package]
name = "image2usb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "image2usb command line interface"

[[bin]]
name = "image2usb"
path = "src/main.rs"

[features]
windows-media = ["image2usb-extract/windows-media"]

[dependencies]
image2usb-core.workspace = true
image2usb-platform.workspace = true
image2usb-iso.workspace = true
image2usb-extract.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc = "3"

[dev-dependencies]
tempfile.workspace = true
image2usb-testiso = { path = "../testiso" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints.rust]
unsafe_code = "forbid"
